<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notch AI Monitor · Interactive</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./interactive.css" />
  </head>
  <body>
    <!-- data-state: dormant | glance | peek | expanded -->
    <!-- data-mood:  none | waiting | happy | sad | angry  -->
    <main class="desktop" data-state="dormant" data-mood="none">
      <div class="wallpaper" aria-hidden="true"></div>

      <header class="menu-bar" aria-label="macOS menu bar">
        <div class="menu-left">
          <span class="apple-mark" aria-hidden="true"></span>
          <strong>Finder</strong>
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Go</span>
          <span>Window</span>
          <span>Help</span>
        </div>
        <div class="menu-right">
          <span class="play-mark" aria-hidden="true"></span>
          <span class="wifi-mark" aria-hidden="true"></span>
          <span class="battery-mark" aria-hidden="true"></span>
          <span>Tue 10:42 AM</span>
        </div>
      </header>

      <!-- ============ The living notch ============ -->
      <div class="notch-zone" id="notchZone">
        <!-- Left capsule: aggregated running summary (collapsed by default) -->
        <button class="side-capsule left-capsule" type="button" id="leftCapsule" aria-label="正在运行的会话">
          <span class="tool-icon claude"></span>
          <span class="cap-text"><b id="leadName">Claude</b><span class="time" id="leadTime">12分钟</span></span>
        </button>

        <!-- The notch itself -->
        <div class="notch" id="notch">
          <span class="camera-dot"></span>
          <!-- Dormant: a single tiny sleeping eye on the lower edge -->
          <span class="dormant-eye" aria-hidden="true"></span>
        </div>

        <!-- Right capsule: only the thing that needs you -->
        <button class="side-capsule right-capsule" type="button" id="rightCapsule" aria-label="需要你处理的提醒">
          <span class="ring-indicator"></span>
          <span class="alert-label" id="alertLabel">等待确认</span>
          <span class="alert-count" id="alertCount">2</span>
          <span class="alert-word">待办</span>
          <span class="face main-face" aria-hidden="true">
            <span class="eye left"><i class="tear"></i></span>
            <span class="eye right"><i class="tear"></i></span>
            <span class="mouth"></span>
          </span>
        </button>

        <!-- Sessions panel (opened from the LEFT capsule): manage all sessions -->
        <section class="expanded-panel sessions-panel" id="sessionsPanel" aria-label="全部会话">
          <div class="sessions-list" id="sessionsList">
            <button class="session-item" type="button" data-go-action="claude">
              <span class="tool-icon claude large"></span>
              <span class="session-meta">
                <span class="s-head"><strong>Claude CLI</strong><b class="s-state running">运行中</b></span>
                <small>iTerm · autoXhs</small>
              </span>
              <span class="s-time">12分钟</span>
              <span class="chevron"></span>
            </button>
            <button class="session-item" type="button" data-go-action="codex">
              <span class="tool-icon codex large"></span>
              <span class="session-meta">
                <span class="s-head"><strong>Codex CLI</strong><b class="s-state running">运行中</b></span>
                <small>Terminal · wBot</small>
              </span>
              <span class="s-time">8分钟</span>
              <span class="chevron"></span>
            </button>
            <button class="session-item" type="button" data-go-action="qwen">
              <span class="tool-icon qwen large"></span>
              <span class="session-meta">
                <span class="s-head"><strong>Qwen CLI</strong><b class="s-state idle">空闲</b></span>
                <small>iTerm · mlPipe</small>
              </span>
              <span class="s-time">—</span>
              <span class="chevron"></span>
            </button>
          </div>
          <footer class="panel-footer">
            <span>3 个会话</span>
            <span>打开会话管理…</span>
          </footer>
        </section>

        <!-- Action popover (opened from the RIGHT capsule): handle what needs you -->
        <section class="expanded-panel action-panel" id="expandedPanel" aria-label="会话操作">
          <div class="session-tabs" id="sessionTabs">
            <button class="selected" type="button">Qwen CLI</button>
            <button type="button">Claude CLI</button>
            <button type="button">Codex CLI</button>
            <span class="tab-count">第 1 / 2 项</span>
          </div>

          <div class="focus-action">
            <span class="tool-icon qwen large"></span>
            <div class="focus-copy">
              <strong id="focusTitle">Qwen CLI 需要确认</strong>
              <small id="focusSource">Terminal · autoXhs</small>
            </div>
          </div>
          <p class="prompt" id="focusPrompt">运行生成的命令？</p>
          <div class="pager">
            <button type="button" aria-label="上一条">‹</button>
            <span>第 1 / 2 项</span>
            <button type="button" aria-label="下一条">›</button>
          </div>
          <div class="action-buttons">
            <button type="button">定位</button>
            <button class="primary" type="button">查看</button>
          </div>

          <footer class="panel-footer">
            <span id="sessionCount">3 个会话</span>
            <span>打开会话管理…</span>
          </footer>
        </section>
      </div>

      <!-- ============ Demo control panel (not part of product) ============ -->
      <aside class="control-deck" aria-label="原型控制台">
        <h3>演示控制台</h3>
        <p class="deck-note">像真实事件那样驱动刘海。</p>

        <div class="deck-group">
          <span class="deck-label">场景 / 情绪</span>
          <div class="deck-row">
            <button type="button" data-scenario="idle">全部运行（空闲）</button>
            <button type="button" data-scenario="waiting">等待确认</button>
          </div>
          <div class="deck-row">
            <button type="button" data-scenario="happy">结果就绪</button>
            <button type="button" data-scenario="sad">出错</button>
            <button type="button" data-scenario="angry">风险</button>
          </div>
        </div>

        <div class="deck-group">
          <span class="deck-label">状态</span>
          <div class="deck-row">
            <button type="button" data-force-state="dormant">休眠</button>
            <button type="button" data-force-state="glance">一瞥</button>
          </div>
          <div class="deck-row">
            <button type="button" data-force-state="peek">探出</button>
            <button type="button" data-force-state="expanded">展开</button>
          </div>
        </div>

        <p class="deck-hint" id="deckHint">悬停刘海可探出 · 点击可展开。</p>
      </aside>
    </main>

    <script src="./interactive.js"></script>
  </body>
</html>
